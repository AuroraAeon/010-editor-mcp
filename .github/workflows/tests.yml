name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: pnpm exec uv sync --frozen --dev
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec uv build --wheel
      - name: Verify wheel bridge resources
        run: pnpm exec uv run --frozen python -c "import pathlib,zipfile; wheel=next(pathlib.Path('dist').glob('*.whl')); names=zipfile.ZipFile(wheel).namelist(); assert 'editor010_mcp/bridge_scripts/command.1sc' in names"
